jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # عالی، همین را حفظ کن
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71f02bbeb416526e734547285653ad76f3f0
      
      - name: Setup Deno
        uses: denoland/setup-deno@42ca2de708af26e881181e3edc617b010c9d4e1d # از SHA استفاده کن
        with:
          deno-version: v1.x

      - name: Verify Formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Run tests
        run: deno test -A # اگر تست‌ها به دسترسی خاصی نیاز دارند

- uses: actions/checkout@11bd71f02bbeb416526e734547285653ad76f3f0 # SHA نسخه v4
